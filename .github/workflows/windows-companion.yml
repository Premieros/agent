name: Windows Companion EXE
on:
  push:
    branches:
      - feature/support-ai-multproject
    paths:
      - 'windows-companion/**'
      - '.github/workflows/windows-companion.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'windows-companion/**'
      - '.github/workflows/windows-companion.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned requirements
        run: python -m pip install -r windows-companion/requirements.txt
      - name: Check Python syntax
        run: python -m py_compile windows-companion/companion.py
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --onefile --windowed --name PremierAgentCompanion windows-companion/companion.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PremierAgentCompanion-Windows
          path: dist/PremierAgentCompanion.exe
          if-no-files-found: error
