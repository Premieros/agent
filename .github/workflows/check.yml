name: AGENT build check

on:
  push:
    branches: [main, dev/isolated-project-download-20261020, dev/multifile-work-engine-20261020]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Next.js and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test indexed research without network or credentials
        run: npm run test:research
      - name: Verify trusted multi-file app in the same no-network Docker boundary
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/agent-multi-smoke"
          mkdir -p "$root"
          export AGENT_SMOKE_ROOT="$root"
          node --experimental-strip-types --input-type=module <<'JS'
          import {builtInProjectRecipe} from "./lib/agent-project-recipes.ts";
          import {parseProjectSpec} from "./lib/agent-project-engine.ts";
          import {mkdirSync,writeFileSync} from "node:fs";
          import {join,dirname} from "node:path";
          for(const [folder,task] of [
            ["tasks","ابن تطبيق إدارة مهام"],
            ["inventory","ابن تطبيق إدارة مخزون"]
          ]){
            const spec=parseProjectSpec(JSON.stringify(builtInProjectRecipe(task)));
            for(const file of spec.files){
              const target=join(process.env.AGENT_SMOKE_ROOT,folder,file.path);
              mkdirSync(dirname(target),{recursive:true,mode:0o755});
              writeFileSync(target,file.content,{mode:0o644});
            }
          }
          JS
          chmod -R a+rX "$root"
          mkdir -p "$RUNNER_TEMP/agent-independent-acceptance"
          cp tests/agent-independent-acceptance.cjs "$RUNNER_TEMP/agent-independent-acceptance/acceptance.cjs"
          chmod -R a+rX "$RUNNER_TEMP/agent-independent-acceptance"
          for job in tasks inventory; do
            kind=task_board
            if [ "$job" = inventory ]; then kind=inventory; fi
            timeout 45s docker run --rm \
              --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --pids-limit 64 --memory 256m --cpus 1 --user 65534:65534 \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              --mount "type=bind,src=$root/$job,dst=/workspace,readonly" \
              --mount "type=bind,src=$RUNNER_TEMP/agent-independent-acceptance,dst=/acceptance,readonly" \
              -e AGENT_ACCEPTANCE_KIND="$kind" -e AGENT_WORKSPACE_ROOT=/workspace \
              node:22-alpine sh -ec 'cd /workspace; node --check server.js; node --test; node --test /acceptance/acceptance.cjs'
          done
      - name: Execute exact isolated AGENT workflow scripts without API tokens
        shell: bash
        run: node --experimental-strip-types scripts/verify-agent-runner.mjs
      - name: Build without external credentials
        run: npm run build
      - name: Check TypeScript
        run: npm run typecheck
