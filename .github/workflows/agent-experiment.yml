name: AGENT isolated experiment

run-name: AGENT experiment ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Non-secret AGENT request identifier"
        required: true
        type: string
      code_b64:
        description: "Approved demo JavaScript, base64; no private data/secrets"
        required: false
        type: string
      project_b64:
        description: "Public-safe multi-file JSON manifest; never send private files"
        required: false
        type: string

# No workflow repository permissions. Never checkout source or use secrets.
permissions: {}

concurrency:
  group: agent-experiment-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  experiment:
    name: Run isolated Node experiment
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Prepare approved JavaScript without logging input
        shell: bash
        env:
          AGENT_REQUEST_ID: ${{ inputs.request_id }}
          AGENT_CODE_B64: ${{ inputs.code_b64 }}
          AGENT_PROJECT_B64: ${{ inputs.project_b64 }}
        run: |
          python3 - <<'PY'
          import base64, binascii, json, os, pathlib, re
          identifier=os.environ.get("AGENT_REQUEST_ID","")
          if not re.fullmatch(r"[0-9a-fA-F-]{36}",identifier):
              raise ValueError("Invalid experiment ID")
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"agent-experiment"
          root.mkdir(mode=0o755,exist_ok=True)
          project=os.environ.get("AGENT_PROJECT_B64","")
          code=os.environ.get("AGENT_CODE_B64","")
          if bool(project)==bool(code):
              raise ValueError("Exactly one experiment mode is required")
          if project:
              if len(project)>56000: raise ValueError("Manifest too large")
              try: payload=base64.b64decode(project,validate=True)
              except binascii.Error as exc: raise ValueError("Invalid project data") from exc
              if not 10<=len(payload)<=40000: raise ValueError("Invalid project size")
              manifest=json.loads(payload)
              files=manifest.get("files",[]) if isinstance(manifest,dict) else []
              if not isinstance(files,list) or not 4<=len(files)<=22:
                  raise ValueError("Invalid file count")
              seen=set()
              found_source=found_tests=False
              for file in files:
                  if not isinstance(file,dict): raise ValueError("Invalid project file")
                  name=file.get("path"); content=file.get("content")
                  if not isinstance(name,str) or not isinstance(content,str):
                      raise ValueError("Invalid project file")
                  parts=name.split("/")
                  if len(name)>140 or len(parts)>5 or not all(
                      re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*",p) and
                      p not in (".","..") and not p.startswith(".") for p in parts
                  ): raise ValueError("Unsafe project path")
                  if any(p.lower() in ("node_modules",".git",".next","vendor") for p in parts):
                      raise ValueError("Unsafe directory")
                  if not re.search(r"\.(js|mjs|cjs|json|html|css|md|txt|svg)$",name,re.I):
                      raise ValueError("Unsupported extension")
                  if name.lower() in seen or name.lower() in (
                    "package.json","agent-readme.md","test-results.txt"
                  ): raise ValueError("Duplicate or reserved file")
                  seen.add(name.lower())
                  encoded=content.encode("utf8")
                  if not 1<=len(encoded)<=24000: raise ValueError("Invalid file size")
                  found_source|=bool(re.search(r"\.(js|mjs|cjs)$",name))
                  found_tests|=bool(re.search(r"\.test\.(js|mjs|cjs)$",name))
                  dest=root.joinpath(*parts)
                  dest.parent.mkdir(parents=True,mode=0o755,exist_ok=True)
                  dest.write_bytes(encoded)
                  dest.chmod(0o644)
              if not found_source or not found_tests: raise ValueError("No code or test")
              print("Validated standalone multi-file project; no source checkout or secrets.")
          else:
              if len(code)>9000: raise ValueError("Experiment too large")
              try: program=base64.b64decode(code,validate=True)
              except binascii.Error as exc: raise ValueError("Invalid encoded program") from exc
              if not 1<=len(program)<=6000: raise ValueError("Invalid program size")
              (root/"work.js").write_bytes(program)
              (root/"task.json").write_text(json.dumps({
                  "task":"AGENT public-safe experiment",
                  "steps":[],"materials":""
              }),encoding="utf8")
              os.chmod(root/"work.js",0o644)
              os.chmod(root/"task.json",0o644)
              print("Approved JavaScript prepared; no source checkout, no secrets.")
          PY
      - name: Execute without network or GitHub credentials
        shell: bash
        run: |
          set -uo pipefail
          root="$RUNNER_TEMP/agent-experiment"
          echo '$ docker run --network none --read-only --user 65534:65534 node:22-alpine'
          echo '$ node --check generated files; node --test (or legacy work.js)'
          set +e
          timeout --signal=TERM 45s docker run --rm \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 \
            --memory 256m --cpus 1 --user 65534:65534 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount "type=bind,src=$root,dst=/workspace,readonly" \
            node:22-alpine sh -c '
              set -eu
              if [ -f /workspace/work.js ]; then
                node --check /workspace/work.js
                node /workspace/work.js
              else
                find /workspace -type f \( -name "*.js" -o -name "*.mjs" -o -name "*.cjs" \) | sort |
                while IFS= read -r file; do node --check "$file"; done
                cd /workspace
                node --test
              fi
            ' \
            > "$RUNNER_TEMP/agent-output.txt" 2>&1
          exit_code=$?
          set -e
          echo "== Standard output and errors (max 12KB) =="
          head -c 12000 "$RUNNER_TEMP/agent-output.txt"
          echo
          echo "[exit=$exit_code]"
          if [ "$exit_code" -ne 0 ]; then exit 1; fi
